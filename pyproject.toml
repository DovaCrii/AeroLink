[project]
name = "aerolink"
version = "0.1.0"
description = "Standalone DJI Cloud API gateway for flight telemetry and evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "prometheus-client>=0.21,<1",
    "paho-mqtt>=2.1,<3",
    # AL-105: S3 API rather than the MinIO SDK. MinIO is what runs today, but the
    # evidence has a 5-year retention and the ADR-0004 relay already showed that
    # "it stays on p340" is not a safe assumption; boto3 keeps a real S3 as a
    # configuration change instead of a rewrite.
    "boto3>=1.35,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerolink"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
