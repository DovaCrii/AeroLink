services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerolink
      POSTGRES_USER: aerolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - aerolink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolink -d aerolink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  emqx:
    image: emqx:5.8
    ports:
      - "127.0.0.1:18083:18083"
      # Keep MQTT loopback-only until AL-104 configures TLS and ACLs.
      - "127.0.0.1:1883:1883"
    volumes:
      - aerolink-emqx:/opt/emqx/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - aerolink-object-storage:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  aerolink-postgres:
  aerolink-emqx:
  aerolink-object-storage:
