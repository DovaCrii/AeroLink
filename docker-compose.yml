services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aerolink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aerolink
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  pilot2-diagnostic:
    build: .
    env_file: .env
    command: uvicorn aerolink.pilot2_diagnostic_server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped

  pilot2-connectivity:
    build: .
    command: uvicorn aerolink.pilot2_connectivity_server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8092:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aerolink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aerolink
    command: python -m aerolink.worker
    # AL-003/AL-R1: p340 has no inbound path from the public internet, so
    # the broker DJI Pilot 2 connects to cannot live here (see the `emqx`
    # service below). This is only an outbound client of an external relay
    # -- MQTT_PUBLIC_HOST/MQTT_WORKER_USERNAME/MQTT_WORKER_PASSWORD in .env
    # must point at that relay, not at this docker-compose stack.
    ports:
      # AL-106: the worker's own metrics -- separate process, separate
      # exposition. Loopback-only, like everything else here.
      - "127.0.0.1:8093:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aerolink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aerolink
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerolink
      POSTGRES_USER: aerolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - aerolink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolink -d aerolink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Not the broker DJI Pilot 2 connects to (AL-003 confirmed p340 has no
  # inbound path from the internet) -- kept loopback-only for local
  # development/testing against `worker` above, not for production.
  emqx:
    image: emqx:5.8
    ports:
      - "127.0.0.1:18083:18083"
      # Keep MQTT loopback-only until AL-104 configures TLS and ACLs.
      - "127.0.0.1:1883:1883"
    volumes:
      - aerolink-emqx:/opt/emqx/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - aerolink-object-storage:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  aerolink-postgres:
  aerolink-emqx:
  aerolink-object-storage:
